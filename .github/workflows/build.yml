{"name":"Build iOS","on":{"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"ubuntu-latest","env":{"EXPO_ASC_API_KEY_PATH":"./asc-key.p8","EXPO_ASC_KEY_ID":"${{ secrets.ASC_KEY_ID }}","EXPO_ASC_ISSUER_ID":"${{ secrets.ASC_ISSUER_ID }}","EXPO_APPLE_TEAM_ID":"${{ secrets.APPLE_TEAM_ID }}","EXPO_APPLE_TEAM_TYPE":"INDIVIDUAL"},"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":20}},{"uses":"expo/expo-github-action@v8","with":{"eas-version":"latest","token":"${{ secrets.EXPO_TOKEN }}"}},{"name":"Install dependencies","run":"npm install"},{"name":"Write Apple API key file","run":"printf '%s' \"$P8\" > ./asc-key.p8","env":{"P8":"${{ secrets.ASC_API_KEY_P8 }}"}},{"name":"Build in EAS cloud","run":"eas build --platform ios --profile production --non-interactive"},{"name":"Send to TestFlight","run":"eas submit --platform ios --latest --non-interactive"}]}}}
